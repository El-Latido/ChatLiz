name: Sync to Hugging Face Space
on:
  push:
    branches: [main, master]
  # Permite ejecutar esta acción manualmente desde GitHub
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
                run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions Sync"
          
          HF_REPO="https://oauth2:$HF_TOKEN@huggingface.co/spaces/AxissHelizabeth/ChatLiz"
          
          # Crear una rama huerfana para evitar subir el historial con los archivos binarios antiguos
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Deploy to Hugging Face Space"
          
          # Empujar forzosamente el estado actual a la rama main de Hugging Face
          git push -f $HF_REPO hf-deploy:main